<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paper Library</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <aside class="sidebar" aria-label="论文库">
      <div class="sidebar-head">
        <a class="brand" href="#" aria-label="Paper Library 首页">
          <span class="brand-mark"></span>
          Paper Library
        </a>
      </div>

      <section class="sidebar-module import-module" aria-label="导入论文">
        <div class="module-head">
          <h2 data-import-module-title>导入论文</h2>
        </div>
        <form class="import-box" data-paper-form>
          <label class="file-drop" for="paper-file">
            <span>导入 PDF</span>
            <strong data-paper-file-name>选择多个论文文件</strong>
          </label>
          <input id="paper-file" name="paper" type="file" accept="application/pdf,.pdf" multiple data-paper-file>
          <label class="secondary-drop" for="paper-folder">导入文件夹</label>
          <input id="paper-folder" name="folder" type="file" accept="application/pdf,.pdf" webkitdirectory multiple data-paper-folder>
          <label class="link-drop">
            <span>粘贴论文链接</span>
            <textarea rows="4" placeholder="粘贴 ChatGPT、网页或笔记里的论文推荐文本，自动识别其中的 PDF 链接。" data-paper-text></textarea>
          </label>
          <button class="primary-button" type="submit" data-paper-submit>解析并入库</button>
        </form>
        <p class="status module-status" data-paper-status>论文库准备就绪。</p>
      </section>

      <section class="sidebar-module manage-module" aria-label="管理论文">
        <div class="module-head">
          <h2 data-manage-module-title>管理论文</h2>
          <button class="text-button" type="button" data-library-manage>打开管理</button>
        </div>
        <div class="library-toolbar">
          <input type="search" placeholder="搜索标题、摘要或文件名" data-paper-search>
          <span data-paper-count>0 篇</span>
        </div>
        <select class="category-filter" data-category-filter aria-label="按分类筛选">
          <option value="">全部分类</option>
        </select>
        <div class="paper-list" data-paper-list></div>
      </section>

      <div class="sidebar-settings">
        <button class="settings-button" type="button" data-settings-toggle>设置</button>
        <div class="settings-panel" data-settings-panel hidden>
          <button class="settings-row" type="button" data-theme-toggle>
            <span>外观</span>
            <strong>深色</strong>
          </button>
          <button class="settings-row" type="button" data-lang-toggle>
            <span>语言</span>
            <strong>中文</strong>
          </button>
          <button class="settings-row danger" type="button" data-paper-clear>
            <span>清空论文库</span>
            <strong>清空</strong>
          </button>
        </div>
      </div>
    </aside>

    <section class="detail-pane" data-paper-detail hidden>
      <header class="detail-head">
        <div>
          <p class="eyebrow">当前论文</p>
          <h1 data-detail-heading>未选择论文</h1>
          <p class="meta" data-paper-meta></p>
        </div>
        <div class="detail-actions">
          <button class="secondary-button" type="button" data-paper-open>打开 PDF</button>
          <button class="secondary-button" type="button" data-paper-open-folder>打开文件夹</button>
          <button class="secondary-button danger" type="button" data-paper-delete>删除</button>
        </div>
      </header>

      <section class="editor-grid">
        <article class="editor-card">
          <label class="field">
            <span>标题</span>
            <input type="text" data-paper-title>
          </label>
          <label class="field">
            <span>分类</span>
            <input type="text" list="category-options" placeholder="未分类" data-paper-category>
          </label>
          <datalist id="category-options" data-category-options></datalist>
          <label class="field">
            <span>摘要</span>
            <textarea rows="13" data-paper-abstract></textarea>
          </label>
          <button class="primary-button" type="button" data-paper-save>保存修改</button>
          <p class="status" data-paper-manage-status></p>
        </article>

        <article class="source-card">
          <p class="eyebrow">原文</p>
          <h2 data-paper-original-title></h2>
          <dl class="paper-bibliography" data-paper-bibliography></dl>
          <p data-paper-original-abstract></p>
        </article>
      </section>

      <section class="figures-section">
        <div class="section-title">
          <p class="eyebrow">Figures</p>
          <h2>论文图片</h2>
        </div>
        <div class="paper-gallery" data-paper-gallery aria-label="论文图片"></div>
      </section>
    </section>

    <section class="manager-pane" data-manager-pane hidden>
      <header class="manager-hero">
        <div>
          <p class="eyebrow">Library Manager</p>
          <h1>论文库管理</h1>
        </div>
        <p class="manager-summary" data-manager-summary>正在读取论文库...</p>
      </header>

      <section class="manager-controls" aria-label="论文筛选">
        <input type="search" placeholder="搜索标题、摘要、文件名、分类或来源链接" data-manager-search>
        <select data-manager-category aria-label="按分类筛选">
          <option value="">全部分类</option>
        </select>
        <select data-manager-sort aria-label="排序">
          <option value="imported-desc">最近导入</option>
          <option value="imported-asc">最早导入</option>
          <option value="title-asc">标题 A-Z</option>
          <option value="title-desc">标题 Z-A</option>
          <option value="size-desc">文件从大到小</option>
          <option value="size-asc">文件从小到大</option>
        </select>
        <select data-manager-page-size aria-label="每页数量">
          <option value="50">每页 50</option>
          <option value="100">每页 100</option>
          <option value="200">每页 200</option>
        </select>
      </section>

      <section class="manager-bulk" data-manager-bulk hidden>
        <strong data-manager-selected-summary>已选 0 篇</strong>
        <input type="text" placeholder="批量设置分类" data-manager-bulk-category>
        <button class="secondary-button" type="button" data-manager-bulk-apply>应用分类</button>
        <button class="secondary-button" type="button" data-manager-clear-selection>取消选择</button>
        <button class="secondary-button danger" type="button" data-manager-bulk-delete>删除所选</button>
      </section>

      <section class="manager-table-wrap" aria-label="论文列表">
        <table class="manager-table">
          <thead>
            <tr>
              <th class="check-cell"><input type="checkbox" data-manager-select-page aria-label="选择当前页"></th>
              <th>标题</th>
              <th>分类</th>
              <th>文件</th>
              <th>页数</th>
              <th>图片</th>
              <th>大小</th>
              <th>导入时间</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody data-manager-rows></tbody>
        </table>
      </section>

      <footer class="manager-pagination">
        <button class="secondary-button" type="button" data-manager-prev-page>上一页</button>
        <span data-manager-page-info>第 1 页</span>
        <button class="secondary-button" type="button" data-manager-next-page>下一页</button>
      </footer>
    </section>

    <section class="empty-state" data-empty-state>
      <p class="eyebrow">Library</p>
      <h1>导入论文后开始整理。</h1>
      <p>标题、摘要、图片和原始 PDF 会保存在这个浏览器的本地论文库。</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
